<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="maintTitle">Coming Soon</title>
  <link rel="icon" type="image/png" href="pics/1.png">
  <link rel="stylesheet" href="css/shared.css" />
  <style>
    body {
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }
    .maint-logo {
      font-family: var(--font-serif);
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 0.3em;
      margin-bottom: 40px;
      text-transform: uppercase;
      color: var(--white);
    }
    .maint-heading {
      font-family: var(--font-serif);
      font-size: 36px;
      margin-bottom: 24px;
      color: var(--gold);
      max-width: 700px;
      line-height: 1.3;
    }
    .maint-desc {
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--gray-500);
      line-height: 1.8;
      max-width: 550px;
      margin-bottom: 40px;
    }
    .maint-footer {
      position: absolute;
      bottom: 30px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-500);
    }
  </style>
</head>
<body>
  <div class="maint-logo">eye</div>
  <h1 class="maint-heading" id="maintHeading">We're Working on Something Amazing</h1>
  <div class="maint-desc" id="maintDesc">Our website is currently undergoing improvements to provide you with a better experience. Please check back soon.</div>
  <a href="#" class="btn btn-gold" id="maintBtn" style="display:none; padding: 16px 36px; letter-spacing: 0.2em; font-size: 11px; text-decoration: none;">Contact Us</a>
  
  <div class="maint-footer" id="maintFooter">© 2026 JOLARDO. ALL RIGHTS RESERVED.</div>

  <!-- Loading settings -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    async function loadMaintenance() {
      const raw = await EyeApi.getSiteSetting('maintenance');
      if (raw) {
        try {
          const m = JSON.parse(raw);
          if (m.title) document.title = m.title;
          if (m.heading) document.getElementById('maintHeading').textContent = m.heading;
          
          if (m.description) {
            // Support simple formatting
            let descHtml = m.description.replace(/\n/g, '<br>');
            document.getElementById('maintDesc').innerHTML = descHtml;
          }
          
          const btn = document.getElementById('maintBtn');
          if (m.buttonText && m.buttonUrl) {
            btn.textContent = m.buttonText;
            btn.href = m.buttonUrl;
            btn.style.display = 'inline-block';
          } else {
            btn.style.display = 'none';
          }

          if (m.footerText) document.getElementById('maintFooter').textContent = m.footerText;
          
          // If maintenance mode is turned OFF while they are here, auto-redirect back to home
          if (!m.active && window.location.pathname.includes('maintenance.html')) {
            window.location.href = 'index.html';
          }
        } catch(e) {
          console.error("Failed to parse maintenance settings", e);
        }
      }
    }
    
    // Initial load
    loadMaintenance();
    
    // Auto-refresh every 15 seconds to check if maintenance is turned off
    setInterval(loadMaintenance, 15000);
  </script>
</body>
</html>
